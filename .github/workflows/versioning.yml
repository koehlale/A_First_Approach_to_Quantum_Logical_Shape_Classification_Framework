name: Versioning the pyproject file
on: [push]
jobs:
  update:
    name: Versioning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v4
      - name: Install poetry
        uses: abatilo/actions-poetry@v2
      - name: Chaning the version number
        run: poetry version patch
